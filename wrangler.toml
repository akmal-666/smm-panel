name = "smm-panel"
compatibility_date = "2024-01-01"
pages_build_output_dir = "./public"

[vars]
ENVIRONMENT = "production"

# Kurs USD ke IDR (update jika perlu)
# Bisa di-override via Cloudflare Pages dashboard → Settings → Environment Variables
USD_TO_IDR = "16300"

# Markup harga dari provider (2.0 = 100% markup, harga jual 2x harga provider)
PRICE_MARKUP = "2.0"

# ── Variabel RAHASIA — set di Cloudflare Pages dashboard, BUKAN di sini ──
# Settings → Environment Variables → Add variable
#
#   PROVIDER_API_URL  = https://asokapanel.com/api/v2
#   PROVIDER_API_KEY  = <API key dari dashboard AsokaPanel>
#   JWT_SECRET        = <random string min 32 karakter>
#   WEBHOOK_SECRET    = <secret untuk callback payment gateway>

# ── D1 Database binding ──
# Setelah buat D1 database, ganti database_id di bawah:
# Run: wrangler d1 create smm-panel-db
# Lalu copy database_id dari output
[[d1_databases]]
binding = "DB"
database_name = "smm-panel-db"
database_id = "14ae6b4b-1be2-46c5-bccd-4bff1b426852"
